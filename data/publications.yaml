    - { label: "Data", url: "https://huggingface.co/datasets/HTW-KI-Werkstatt/DiffuMT" }

- title: "RamanBench: A Large-Scale Benchmark for Machine Learning on Raman Spectroscopy"
  url: "https://arxiv.org/abs/2605.02003"
  authors: "Koddenbrock, M., Lange, C., Legner, R., Jäger, M., Kögler, M., Cruz Bournazou, M. N., Neubauer, P., Biessmann, F., Rodner, E."
  venue: "NeurIPS 2026"
  year: 2026
  selected: true
  abstract: "We introduce RamanBench, the first large-scale, fully reproducible benchmark for machine learning on Raman spectroscopy. It unifies 77 datasets (17 released for the first time) across four domains, comprising more than 325,000 spectra for classification and regression tasks. Benchmarking 28 models, we find that tabular foundation models such as TabPFN consistently outperform Raman-specific and gradient boosting baselines, while time-series models remain competitive. Yet no single method dominates, showing that Raman spectroscopy remains an open challenge for ML."
  links:
    - { label: "arXiv", url: "https://arxiv.org/abs/2605.02003" }
    - { label: "Leaderboard", url: "https://huggingface.co/spaces/HTW-KI-Werkstatt/RamanBench" }
    - { label: "Code", url: "https://github.com/ml-lab-htw/RamanBench" }
    - { label: "Data", url: "https://pypi.org/project/raman-data/" }

- title: "Synthetic data enables human-grade microtubule analysis with foundation models for segmentation"
  url: "https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1013901"
  authors: "Koddenbrock, M., Westerhoff, J., Fachet, D., Reber, S., Gers, F., Rodner, E."
  venue: "PLOS Computational Biology 22(5): e1013901"
  year: 2026
  selected: true
  abstract: "This paper introduces SynthMT, a synthetic dataset for microtubule (MT) segmentation, to address the lack of large-scale labeled data. By evaluating various automated methods, we show that the SAM3 model, when fine-tuned on a small number of synthetic images, achieves near-perfect, and sometimes super-human, performance on real-world data. This demonstrates that synthetic data can enable fully automated and highly accurate MT segmentation."
  links:
    - { label: "Paper", url: "https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1013901" }
    - { label: "Project page", url: "https://DATEXIS.github.io/SynthMT-project-page" }

- title: "On the Domain Robustness of Contrastive Vision-Language Models"
  url: "https://link.springer.com/chapter/10.1007/978-3-032-02813-6_5"
  authors: "Koddenbrock, M., Hoffmann, R., Brodmann, D., Rodner, E."
  venue: "KI 2025"
  year: 2025
  badge: "Best Paper Award"
  abstract: "We present DeepBench, a framework for assessing the domain-specific robustness of vision-language models (VLMs). Unlike standard benchmarks, DeepBench uses an LLM to generate realistic, context-aware image corruptions tailored to target domains, without requiring labels. Evaluating multiple contrastive VLM architectures across six real-world domains, we find substantial variability in robustness, underscoring the need for domain-aware evaluation."
  links:
    - { label: "Paper", url: "https://link.springer.com/chapter/10.1007/978-3-032-02813-6_5" }
    - { label: "Code", url: "https://github.com/ml-lab-htw/deepbench" }

- title: "\"Oh LLM, I'm Asking Thee, Please Give Me a Decision Tree\": Zero-Shot Decision Tree Induction and Embedding with Large Language Models"
  url: "https://dl.acm.org/doi/10.1145/3711896.3736818"
  authors: "Knauer, R., Koddenbrock, M., Wallsberger, ..., Rodner, E."
  venue: "ACM KDD 2025"
  year: 2025
  abstract: "This paper demonstrates how large language models (LLMs) can generate intrinsically interpretable decision trees without any training data, surpassing data-driven trees on some small-sized tabular datasets and performing on par with data-driven tree-based embeddings on average."
  links:
    - { label: "Paper", url: "https://dl.acm.org/doi/10.1145/3711896.3736818" }
    - { label: "Code", url: "https://github.com/ml-lab-htw/llm-trees" }

- title: "Robust Weight Imprinting: Insights from Neural Collapse and Proxy-Based Aggregation"
  url: "https://arxiv.org/abs/2503.14572"
  authors: "Westerhoff, J., Atefi, G., Koddenbrock, M., Figueroa, A., Löser, A., Rodner, E., Gers, F."
  venue: "TMLR 2025"
  year: 2025
  abstract: "We propose a framework for imprinting, identifying three main components: generation, normalization, and aggregation, and show an increase of up to 4% in challenging scenarios with complex data distributions for new classes. Furthermore, we found connections of neural collapse to multi-proxy imprinting."
  links:
    - { label: "arXiv", url: "https://arxiv.org/abs/2503.14572" }
    - { label: "Code", url: "https://github.com/DATEXIS/IMPRINT" }

