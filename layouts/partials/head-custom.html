<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
{{- $custom_css := resources.Get "css/custom.css" | resources.Minify | resources.Fingerprint -}}
<link rel="stylesheet" href="{{ $custom_css.RelPermalink }}" integrity="{{ $custom_css.Data.Integrity }}">
{{- /* Social preview image (PaperMod only emits one when the page has image resources) */}}

<meta property="og:image" content="{{ $og.Permalink }}">
<meta name="twitter:image" content="{{ $og.Permalink }}">
